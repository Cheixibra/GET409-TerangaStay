<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATA suarl — Carte de visite</title>
<style>
  :root {
    --bg-1: #14110F;
    --bg-2: #211B17;
    --card: #1C1714;
    --line: #3A302A;
    --ink: #F4EEE6;
    --muted: #B8ADA2;
    --accent: #E2572B;
    --accent-ink: #14110F;
    --shadow: rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
  /* Light theme derived from the dark palette; same orange accent in both. */
  :root[data-theme="light"] {
    --bg-1: #F6F4EF;
    --bg-2: #FFFFFF;
    --card: #FFFDF9;
    --line: #E4DAD0;
    --ink: #16181D;
    --muted: #5E554D;
    --accent: #E2572B;
    --accent-ink: #FFFFFF;
    --shadow: rgba(60, 40, 20, .12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg-1: #F6F4EF;
      --bg-2: #FFFFFF;
      --card: #FFFDF9;
      --line: #E4DAD0;
      --ink: #16181D;
      --muted: #5E554D;
      --accent: #E2572B;
      --accent-ink: #FFFFFF;
      --shadow: rgba(60, 40, 20, .12);
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: radial-gradient(120% 90% at 20% 10%, var(--bg-2), var(--bg-1));
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 32px 28px 24px;
    box-shadow: 0 24px 60px var(--shadow);
  }
  .mark {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    font-weight: 800; letter-spacing: .02em;
  }
  h1 { margin: 18px 0 4px; font-size: 1.9rem; line-height: 1.1; letter-spacing: -.01em; }
  .pitch { margin: 0 0 20px; color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; padding: 0; list-style: none; }
  .tags li {
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--line); font-size: .88rem;
  }
  .contact { border-top: 1px solid var(--line); padding-top: 18px; display: grid; gap: 10px; }
  .contact p { margin: 0; color: var(--muted); font-size: .92rem; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .email { color: var(--ink); font-weight: 600; text-decoration: none; word-break: break-all; }
  .email:hover { color: var(--accent); }
  button {
    font: inherit; font-size: .85rem; cursor: pointer;
    border: 1px solid var(--accent); background: transparent; color: var(--accent);
    border-radius: 999px; padding: 5px 12px;
  }
  button:hover, button:focus-visible { background: var(--accent); color: var(--accent-ink); outline: none; }
  footer {
    margin-top: 22px; display: flex; justify-content: space-between; align-items: center;
    font-size: .8rem; color: var(--muted);
  }
  @media (max-width: 400px) {
    .card { padding: 24px 18px 18px; }
    h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">ATA</div>
    <h1>ATA suarl</h1>
    <p class="pitch">Studio de technologies créatives à Dakar : nous imaginons et fabriquons des mondes réels et imaginaires.</p>
    <ul class="tags" aria-label="Services">
      <li>Animation 3D</li>
      <li>Expériences XR</li>
      <li>Jeux vidéo</li>
      <li>IA générative</li>
    </ul>
    <section class="contact" aria-label="Contact">
      <p>Dakar, Sénégal</p>
      <div class="row">
        <a class="email" id="email" href="mailto:contact@exemple.sn">contact@exemple.sn</a>
        <button id="copy" type="button">Copier l'email</button>
      </div>
    </section>
    <footer>
      <span>© ATA suarl</span>
      <button id="theme" type="button" aria-label="Basculer le thème clair ou sombre">◐ Thème</button>
    </footer>
  </main>
<script>
  (function () {
    var root = document.documentElement;
    var KEY = "ata-card-theme";
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved);

    function current() {
      var t = root.getAttribute("data-theme");
      if (t) return t;
      return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    document.getElementById("theme").addEventListener("click", function () {
      var next = current() === "light" ? "dark" : "light";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem(KEY, next); } catch (e) {}
    });

    var copyBtn = document.getElementById("copy");
    copyBtn.addEventListener("click", function () {
      var email = document.getElementById("email").textContent.trim();
      function done(ok) {
        copyBtn.textContent = ok ? "Copié ✓" : "Copie impossible";
        setTimeout(function () { copyBtn.textContent = "Copier l'email"; }, 1800);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).then(function () { done(true); }, function () { done(false); });
      } else {
        var ta = document.createElement("textarea");
        ta.value = email; document.body.appendChild(ta); ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta); done(ok);
      }
    });
  })();
</script>
</body>
</html>
